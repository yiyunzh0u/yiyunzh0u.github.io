<dialog class="paper-image-dialog" aria-label="Full-size publication image">
  <button class="paper-image-dialog__close" type="button" aria-label="Close image preview">&times;</button>
  <img class="paper-image-dialog__image" alt="">
</dialog>

<script>
  (function () {
    var dialog = document.querySelector('.paper-image-dialog');
    if (!dialog) return;

    var preview = dialog.querySelector('.paper-image-dialog__image');
    var closeButton = dialog.querySelector('.paper-image-dialog__close');

    document.querySelectorAll('.paper-image-trigger').forEach(function (trigger) {
      trigger.addEventListener('click', function () {
        var image = trigger.querySelector('.paper-image');
        if (!image) return;

        if (typeof dialog.showModal !== 'function') {
          window.open(image.currentSrc || image.src, '_blank', 'noopener');
          return;
        }

        preview.src = image.currentSrc || image.src;
        preview.alt = image.alt;
        dialog.showModal();
      });
    });

    closeButton.addEventListener('click', function () {
      dialog.close();
    });

    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });

    dialog.addEventListener('close', function () {
      preview.removeAttribute('src');
      preview.alt = '';
    });
  }());
</script>

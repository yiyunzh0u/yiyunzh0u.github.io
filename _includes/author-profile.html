{% assign author = site.author %}
<div itemscope itemtype="https://schema.org/Person" class="profile_box">
  <div class="author__avatar">
    <img src="{{ author.avatar | relative_url }}" alt="{{ author.name }}" width="300" height="300">
  </div>

  <div class="author__content">
    <h3 class="author__name">{{ author.name }}</h3>
    <p class="author__bio">{{ author.bio }}</p>
  </div>

  <div class="author__urls-wrapper">
    <ul class="author__urls social-icons">
      <li><div class="author__focus">{{ site.description }}</div></li>
      <li><span class="profile-icon" aria-hidden="true">●</span> {{ author.location }}</li>
      <li><a href="mailto:{{ author.email }}"><span class="profile-icon" aria-hidden="true">✉</span> Email</a></li>
      <li><a href="https://github.com/{{ author.github }}" target="_blank" rel="noopener"><span class="profile-icon" aria-hidden="true">↗</span> GitHub</a></li>
      <li><a href="{{ author.googlescholar }}" target="_blank" rel="noopener"><span class="profile-icon" aria-hidden="true">◆</span> Google Scholar</a></li>
    </ul>
  </div>
</div>

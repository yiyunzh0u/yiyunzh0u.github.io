name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler
        run: python -m pip install --disable-pip-version-check -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        env:
          GOOGLE_SCHOLAR_ID: Cb6wvZIAAAAJ
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OUTPUT_DIR: ${{ runner.temp }}/scholar-results
        run: python google_scholar_crawler/main.py

      - name: Publish data branch
        env:
          OUTPUT_DIR: ${{ runner.temp }}/scholar-results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin google-scholar-stats:google-scholar-stats
          git worktree add "${RUNNER_TEMP}/scholar-branch" google-scholar-stats
          cp "${OUTPUT_DIR}/gs_data.json" "${RUNNER_TEMP}/scholar-branch/gs_data.json"
          cp "${OUTPUT_DIR}/gs_data_shieldsio.json" "${RUNNER_TEMP}/scholar-branch/gs_data_shieldsio.json"
          git -C "${RUNNER_TEMP}/scholar-branch" add gs_data.json gs_data_shieldsio.json
          if git -C "${RUNNER_TEMP}/scholar-branch" diff --cached --quiet; then
            echo "Citation data did not change."
            exit 0
          fi
          git -C "${RUNNER_TEMP}/scholar-branch" commit -m "Update citation data"
          git -C "${RUNNER_TEMP}/scholar-branch" push origin google-scholar-stats
